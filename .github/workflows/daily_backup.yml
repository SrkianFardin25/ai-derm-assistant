name: Daily Supabase Database Backup

on:
  schedule:
    # Runs every day at 00:00 UTC (midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual triggers from GitHub Actions UI

jobs:
  backup:
    name: Database Snapshot & Sovereign Archive
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv

      - name: Execute Supabase Database Snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/backup_supabase.py

      - name: Securely Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dermassist-db-backup-${{ github.run_id }}
          path: backups/dermassist_backup_*.json.gz
          retention-days: 30
          if-no-files-found: error
